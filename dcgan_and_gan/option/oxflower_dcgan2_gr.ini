[Dataset.real]
name = oxflower
channel = 3
height = 64 
width = 64
normalize = none
#normalize = scale
normalize.value1 = 0
normalize.value2 = 1
size_data = all
# size_data: 'all' or specific number of data, 1000 for example

[Dataset.fake]
channel = 3
height = 64
width = 64
length_latent = 100

[Transform]
probability = 0.0
# probability: \in [0,1].  probability=1 transforms all the data.
#option: none
#option: rotate,flip,diffuse,crop2,crop4
option = none
use_condition = none
# use_condition: none, input, or hidden
# none:   the condition is not given to discriminator
# input:  the condition is given to the input layer of discriminator
# classifier: the condition is given to the classifier of discriminator

[Network]
#discriminator = Discriminator_Convolution_Stride_Leaky_Relu_64
#generator = Generator_Upsample_Convolution_Batch_Norm_Leaky_Relu_Sigmoid_32
discriminator = DCGAN2_Discriminator_wo_Sigmoid
generator = DCGAN2_Generator

[Optimize]
#algorithm = SGD
algorithm = Adam-0.5
size_batch = 64
number_epoch = 500
trial_id_number = 1


[Optimize.generator]
loss = bce_with_logits
weight_total_variation = 0.0
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10
learning_rate_ratio_division = 2 

[Optimize.discriminator]
loss = bce_with_logits
gradient_regularization = 0.1
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10  
learning_rate_ratio_division = 2 


