[Dataset.real]
name = celeba
channel = 3
height = 64 
width = 64
normalize = none
#normalize = scale
normalize.value1 = 0
normalize.value2 = 1
size_data = all

[Dataset.fake]
channel = 3
height = 64
width = 64
length_latent = 100

[Transform]
probability = 0.0
option = none
use_condition = none

[Network]
discriminator = DCGAN2_Discriminator
generator = DCGAN2_Generator

[Optimize]
#algorithm = SGD
algorithm = Adam-0.5
size_batch = 64
number_epoch = 50
trial_id_number = 1


[Optimize.generator]
loss = wasserstein
weight_total_variation = 0.0
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10
learning_rate_ratio_division = 2 

[Optimize.discriminator]
loss = wasserstein
gradient_regularization = 10
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10  
learning_rate_ratio_division = 2 


