 [Dataset.real]
name = MNIST-4
channel = 1
height = 32 
width = 32 
normalize = none
normalize.value1 = 0
normalize.value2 = 1
size_data = all

[Dataset.fake]
channel = 1
height = 32 
width = 32 
length_latent = 100

[Transform]
probability = 0.0
option = none
use_condition = none

[Network]
discriminator = DCGAN2_Discriminator32_wo_Sigmoid
generator = DCGAN3_Generator32

[Optimize]
#algorithm = SGD
algorithm = Adam-0.5
size_batch = 50
number_epoch = 400
trial_id_number = 1


[Optimize.generator]
loss = bce_with_logits
weight_total_variation = 0.0
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10
learning_rate_ratio_division = 2 

[Optimize.discriminator]
loss = bce_with_logits
gradient_regularization = 0.1
weight_decay = 0.0
momentum = 0.0
learning_rate_initial = 0.0002
learning_rate_middle = 0.0002
learning_rate_final = 0.0002
learning_rate_slope = 10  
learning_rate_ratio_division = 2 


